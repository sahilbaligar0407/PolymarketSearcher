# Strategy tournament definition.
#
# Every entry below expands into one or more experiment variants.  Each variant gets its
# own immutable experiment id and its own virtual $50 sleeve.  The Cartesian product of a
# `variants` block is taken; `variant_limit` caps the expansion so a careless edit cannot
# spawn thousands of noise-mining arms.
#
# Keep grids small.  Every added dimension is another chance to discover randomness.

meta:
  # $100 from 2026-10-05: each algo that graduates will be funded with $100.
  bankroll_per_variant: "100.00"
  # Hard ceiling on total live paper sleeves. The runner refuses to exceed it.
  # 420 (was 400) for the holdings_* families, which act on a 60 s timer and cost
  # almost nothing per market event.
  max_total_variants: 420
  # Recorded in every report so the reader knows how much searching produced a winner.
  record_variant_count: true

# Latency arms applied across execution-sensitive strategies.
latency_arms_ms: [100, 500, 1000, 5000]

strategies:

  # ------------------------------------------------------------------ baselines
  baseline_market:
    enabled: true
    evidence: B
    class: marketlab.strategies.baseline_market:MarketBaselineStrategy
    universes: [btc_15m, btc_1h, btc_daily, sports_nfl, sports_nba, economics_inflation, weather_daily_high, politics_general]
    # Emits forecasts only, never orders. It is the bar every model must clear.
    trades: false
    variants: {}

  random_control:
    enabled: true
    evidence: B
    class: marketlab.strategies.controls:RandomDirectionStrategy
    universes: [btc_15m, btc_1h, sports_nfl]
    variants:
      seed: [1, 2]
    notes: Control group. Trades at the same frequency as a real strategy, at random.

  fade_control:
    enabled: true
    evidence: B
    class: marketlab.strategies.controls:FadeStrategy
    universes: [btc_1h, sports_nfl]
    variants:
      fades: [momentum, copy_trader]
    notes: >
      Deliberately takes the opposite side. If fading a strategy is profitable, that
      strategy's apparent edge is negative and we learn it cheaply.

  # ------------------------------------------------------------------ microstructure
  momentum:
    enabled: true
    evidence: A
    class: marketlab.strategies.momentum:MomentumStrategy
    # Best performer over 25h: 79.9% win rate on 999 resolved trades, +$21.58 net.
    # Its edge is thin though - $46 gross across 999 trades is ~4.6c each and fees took
    # half of it - so the added arms raise the entry threshold rather than trade more.
    universes: [btc_1h, btc_daily, altcoin_1h, index_15m]
    variants:
      lookback_seconds: [300, 900, 1800, 3600]
      threshold: [0.02, 0.04, 0.06]
      volatility_filter: [false, true]
    variant_limit: 16

  mean_reversion:
    enabled: true
    evidence: A
    class: marketlab.strategies.mean_reversion:MeanReversionStrategy
    universes: [btc_15m, btc_1h, altcoin_1h, index_15m]
    variants:
      lookback_seconds: [300, 900, 3600]
      entry_z: [1.5, 2.0, 2.5]
      exit_z: [0.5]
    variant_limit: 6

  book_imbalance:
    enabled: true
    evidence: E
    class: marketlab.strategies.book_imbalance:BookImbalanceStrategy
    universes: [btc_15m, btc_1h, sports_nba, index_15m]
    variants:
      levels: [3, 5]
      threshold: [0.70, 0.80]
      # Both readings are tested. We do not assume which way imbalance points.
      interpretation: [momentum, reversal]
    # Trimmed 8 -> 4 on 2026-09-08. Over 25h it was the highest-volume family (1,063
    # fills) with a 38.8% win rate and the largest fee bill of any strategy ($35.06),
    # netting -$19.46 on settled trades. It trades far too often for the edge it has, so
    # the grid is halved and the threshold floor raised rather than the family cut - a
    # 38.8% win rate with positive gross means there IS signal, it is just being eaten
    # by turnover.
    variant_limit: 4

  market_maker:
    enabled: true
    evidence: B
    class: marketlab.strategies.market_maker:AvellanedaStoikovBinaryStrategy
    universes: [btc_1h, sports_nba, politics_general]
    # base_spread must beat two taker unwind fees (the strategy's own profitability
    # gate). A 1-contract Kalshi fee is never below 1c and is 2c between ~18c and ~82c,
    # so 0.02 can never quote and 0.03 only quotes outside that band. With the old
    # [0.02, 0.03, 0.05] grid, variant_limit 9 kept only the 0.02 arms (the subset is
    # chosen by sorted parameter JSON), and 27 sleeves placed zero orders in a month.
    variants:
      base_spread: [0.05]
      inventory_penalty: [0.5, 1.0, 2.0]
      mode: [two_sided, one_sided, inventory_neutral]
      news_pause: [true]
    variant_limit: 9

  # ------------------------------------------------------------------ relative value
  binary_parity:
    # Off 2026-10-04: an offline scan found 0 complementary market pairs in every
    # universe (Kalshi expresses "not X" as the NO side of the same market), and the
    # two-team game pairs it misses priced at >= 0.98 combined. 12 sleeves, 0 orders.
    enabled: false
    evidence: B
    class: marketlab.strategies.binary_parity:BinaryParityStrategy
    universes: [btc_1h, sports_nfl, sports_nba, politics_elections]
    variants:
      min_edge: [0.005, 0.01, 0.02]
    variant_limit: 3

  cross_venue:
    enabled: true
    evidence: B
    class: marketlab.strategies.cross_venue:CrossVenueRelativeValueStrategy
    # Polymarket is the SIGNAL source; every order goes to Kalshi.
    # Sports game-winner pairs are proven structurally (marketlab/matching/sports.py);
    # the other universes trade only if the general matcher ever approves a pair.
    # btc/economics/elections were dropped 2026-10-04: in a week the general matcher
    # approved zero pairs there, so those sleeves were idle by construction.
    universes: [sports_mlb, sports_nfl, sports_college, sports_nhl, sports_nba, politics_general]
    variants:
      min_edge: [0.02, 0.03, 0.05, 0.075, 0.10]
      require_match_confidence: [0.90]
    variant_limit: 5

  # ------------------------------------------------------------------ model-driven
  btc_event:
    enabled: true
    evidence: B
    class: marketlab.strategies.btc_event:BtcEventStrategy
    universes: [btc_15m, btc_1h, btc_daily]
    variants:
      vol_window_minutes: [15, 60, 240]
      entry_edge: [0.02, 0.04, 0.06]
      model: [gbm_terminal, gbm_barrier]
    variant_limit: 9

  sports_consensus:
    enabled: true
    evidence: B
    class: marketlab.strategies.sports_consensus:SportsConsensusStrategy
    # +$10.43 net over 25h despite a 34.3% win rate - it buys underpriced longshots, so
    # low win rate is expected and fine. sports_mlb is the best market in the whole
    # tournament (+$27.26); sports_college is the worst sports market (27.3% win,
    # -$15.00) and is dropped.
    universes: [sports_mlb, sports_nfl, sports_nba, sports_nhl]
    variants:
      min_edge: [0.03, 0.05, 0.08]
      source: [vig_free_consensus, market_only, disagreement]
      # A sports strategy must stop using pregame state once the contest starts.
      pregame_only: [true, false]
    variant_limit: 8

  weather_forecast:
    enabled: true
    evidence: B
    class: marketlab.strategies.weather:WeatherForecastStrategy
    universes: [weather_daily_high, weather_hourly]
    variants:
      min_edge: [0.04, 0.08]
      use_forecast_change: [false, true]
    variant_limit: 4

  news_probability:
    enabled: true
    evidence: F
    class: marketlab.strategies.news_probability:NewsProbabilityStrategy
    universes: [politics_general, economics_inflation, economics_fed, companies_events]
    # AI stack arms (marketlab/ai/stack.py). This is the PRD's "AI-enhanced vs
    # Jev-enhanced vs non-AI" comparison:
    #   local       - local Ollama model only
    #   hybrid      - local model, confirmed by an OpenAI second opinion before trading
    #                 (budget-capped by OPENAI_DAILY_BUDGET_USD; out of budget => no trade)
    #   jev         - Jev only            (created only when JEV_BASE_URL is set)
    #   jev_hybrid  - Jev + OpenAI check  (created only when JEV_BASE_URL is set)
    # Every variant of an arm shares one inference per market, so adding entry/evidence
    # variants costs no extra model time.
    variants:
      # Measured 2026-10-04: qwen2.5:3b (local) mostly answers 0.5 (abstained) or 0.0 at
      # ~100% confidence, so `local` is expected to lose; `hybrid` needs the OpenAI check
      # to agree before trading. gpt-oss:20b did not load in 8 min on this laptop.
      ai_stack: [local, hybrid, jev, jev_hybrid]
      entry_edge: [0.06, 0.10]
      min_confidence: [0.6]
      # 0 = the model may lean on background knowledge alone; 1 = needs live evidence.
      min_evidence_items: [0, 1]
      scheduled_refresh_seconds: [3600]
      max_markets_per_pass: [3]
    variant_limit: 16
    requires_ai: true

  public_statement_event:
    enabled: true
    evidence: F
    class: marketlab.strategies.social_event:PublicStatementEventStrategy
    universes: [mentions, companies_events]
    variants:
      # Version one records an event study and does not trade until a category clears
      # its out-of-sample bar. `study_only: true` is the honest default.
      study_only: [true]
    variant_limit: 1

  # ------------------------------------------------------------------ copy trading
  copy_trader:
    enabled: true
    evidence: D
    class: marketlab.strategies.copy_trader:CopyTraderStrategy
    # Signals come from Polymarket wallets; execution is on the matched Kalshi contract.
    universes: [sports_mlb, sports_nfl, sports_college, sports_nhl, sports_nba, politics_general]
    # Wallet activity is polled every ~30 s, so a 1-5 s follow delay was never
    # achievable; 30 s and 120 s are. Modes (2026-10-04):
    #   raw                  copy every tracked leaderboard wallet
    #   consensus            >= 2 tracked wallets, same contract and side, within the window
    #   qualified            only wallets whose realized record is QUALIFIED (TraderScore)
    #   qualified_consensus  >= 2 QUALIFIED wallets agreeing - the PRD's core signal
    #   fade                 the deliberate opposite of raw: a control
    variants:
      follower_delay_seconds: [30, 120]
      mode: [raw, consensus, qualified, qualified_consensus, fade]
    variant_limit: 10
    notes: >
      follower_delay_seconds=0 is deliberately absent from the grid: a zero-latency copy
      is a diagnostic, not a strategy, and is computed in analytics instead.

  copy_basket:
    enabled: true
    evidence: D
    class: marketlab.strategies.copy_trader:CopyBasketStrategy
    universes: [sports_mlb, sports_nfl, sports_college, politics_general]
    variants:
      basket_size: [5, 10, 20]
      weighting: [equal, forward_validated]
      follower_delay_seconds: [5, 30]
    variant_limit: 6

  # ------------------------------------------------------------------ holdings consensus
  # The operator's manual process, automated (marketlab/strategies/holdings_consensus.py):
  # the top 100 wallets on the all-time, monthly and weekly overall leaderboards, every
  # open position they hold, refreshed every 15 min; copy positions many of them share,
  # on the approved Kalshi twin (so far: game winners, hence sports_games). Three
  # families ask three questions.
  #
  # holdings_blind   - copy at any price. Which board, how many must agree, and does
  #                    dropping two-sided (hedging) wallets help?
  holdings_blind:
    enabled: true
    evidence: D
    class: marketlab.strategies.holdings_consensus:HoldingsConsensusStrategy
    universes: [sports_games]
    variants:
      board: [all, month, week, union]
      top_n: [100]
      min_holders: [3, 5]
      net_only: [true, false]
      entry: [blind]
      confirm: [none]
    variant_limit: 16

  # holdings_edge    - copy only while it is still worth it: the price has not run more
  #                    than max_chase past the holders' average entry, and at least
  #                    min_remaining of upside is left ("$5 to make $0.50" is refused).
  holdings_edge:
    enabled: true
    evidence: D
    class: marketlab.strategies.holdings_consensus:HoldingsConsensusStrategy
    universes: [sports_games]
    variants:
      board: [union]
      top_n: [100]
      min_holders: [3, 5]
      net_only: [true]
      entry: [edge]
      max_chase: [0.03, 0.10]
      min_remaining: [0.10, 0.25]
      confirm: [none]
      sizing: [fixed, kelly]
    variant_limit: 16

  # sizing (edge and confirm): fixed 3% per position, or quarter-Kelly on the estimated
  # probability (capped at 4%) - how a limited bankroll is spread across opportunities.
  #
  # holdings_confirm - the edge rule plus a second opinion: a relevant news story, Jev
  #                    (TypeSafe; TYPESAFE_API_KEY) putting the outcome above the price,
  #                    or Jev shown the headlines.
  holdings_confirm:
    enabled: true
    evidence: D
    class: marketlab.strategies.holdings_consensus:HoldingsConsensusStrategy
    universes: [sports_games]
    variants:
      board: [union]
      top_n: [100]
      min_holders: [3, 5]
      net_only: [true]
      entry: [edge]
      max_chase: [0.05]
      min_remaining: [0.10]
      confirm: [news, jev, news_jev]
      jev_min_edge: [0.03]
      sizing: [fixed, kelly]
    variant_limit: 12

  # ------------------------------------------------------------------ ensemble
  ensemble:
    enabled: false
    evidence: B
    class: marketlab.strategies.ensemble:EnsembleStrategy
    universes: []
    variants: {}
    notes: >
      Disabled until QUALIFIED components exist. The ensemble may only draw on strategies
      that have already passed promotion; enabling it early would just launder unproven
      signals into a single number.

# Promotion thresholds. Engineering gates, not statistical laws.
promotion:
  fast:
    min_orders: 200
    min_resolved_trades: 100
    min_forward_days: 14
    require_positive_after_conservative_costs: true
  medium:
    min_independent_trades: 75
    min_forward_days: 30
  slow_event:
    min_resolved_events: 30
    min_forward_days: 30
  # Correlated observations do not count as independent. 500 trades on one election is
  # closer to one observation than five hundred.
  independence:
    cluster_by: [event_id, resolution_date, category]
    max_weight_per_cluster: 0.25
  bootstrap:
    resamples: 2000
    confidence: 0.95
    # An estimate whose confidence interval straddles zero is not promoted.
    require_ci_excludes_zero: true

# Champion/challenger. Once something works, it is frozen and challengers must beat it.
champion:
  freeze_on_promotion: true
  challenger_must_win_forward: true
  demote_on:
    drawdown_pct: 0.25
    consecutive_losing_days: 10
    calibration_degradation: 0.05
